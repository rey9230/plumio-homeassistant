name: Firmware

# Builds the Plumio Hogar ESP32 firmware and publishes it to the website
# (rey9230/plumio-landing, public/hogar/firmware), where www.useplumio.com/hogar
# installs it from the browser. Needs the secret LANDING_TOKEN: a fine-grained
# token with "Contents: read and write" on rey9230/plumio-landing.

on:
  push:
    branches: [main]
    paths: ["esphome/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["esphome/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ESPHOME_VERSION: "2026.9.1"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: plumio-hogar.yaml
            chip: ESP32
          - file: plumio-hogar-s3.yaml
            chip: ESP32-S3
          - file: plumio-hogar-presencia.yaml
            chip: ESP32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ env.ESPHOME_VERSION }}-${{ matrix.chip }}
      - run: pip install "esphome==${ESPHOME_VERSION}"
      - name: Compile
        working-directory: esphome
        run: esphome compile "${{ matrix.file }}"
      - name: Collect the image and its manifest
        env:
          FILE: ${{ matrix.file }}
          CHIP: ${{ matrix.chip }}
        run: |
          name="$(basename "$FILE" .yaml)"
          bin="$(find esphome/.esphome/build -name firmware.factory.bin | head -n1)"
          test -n "$bin"
          mkdir -p out
          cp "$bin" "out/${name}.factory.bin"
          version="$(sed -n 's/^ *version: "\(.*\)"/\1/p' esphome/packages/plumio-hogar-base.yaml | head -n1)"
          python3 .github/scripts/firmware_manifest.py "$name" "$CHIP" "$version" > "out/${name}.manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ strategy.job-index }}
          path: out/

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: The website token is set
        env:
          TOKEN: ${{ secrets.LANDING_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Missing secret LANDING_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: firmware
      - uses: actions/checkout@v4
        with:
          repository: rey9230/plumio-landing
          token: ${{ secrets.LANDING_TOKEN }}
          path: landing
      - name: Commit the firmware to the website
        working-directory: landing
        run: |
          mkdir -p public/hogar/firmware
          cp ../firmware/* public/hogar/firmware/
          git add public/hogar/firmware
          if git diff --cached --quiet; then
            echo "Firmware unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "firmware: Plumio Hogar (plumio-homeassistant ${GITHUB_SHA::7})"
          git push
