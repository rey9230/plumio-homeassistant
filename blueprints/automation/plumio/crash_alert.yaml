blueprint:
  name: "Plumio: crash detected"
  description: >
    Plumio detected a possible car crash for a member. Send a critical
    notification, announce it at home and run your own actions (call someone,
    turn on the lights…).
  domain: automation
  source_url: https://github.com/rey9230/plumio-homeassistant/blob/main/blueprints/automation/plumio/crash_alert.yaml
  author: Plumio
  homeassistant:
    min_version: "2024.10.0"
  input:
    members:
      name: Members
      description: The members' "Events" entities.
      selector:
        entity:
          multiple: true
          filter:
            - integration: plumio
              domain: event
    notify_service:
      name: Notification action
      description: >
        A notify action such as `notify.mobile_app_pixel_8`, or a group like
        `notify.family`. Leave empty to not send a notification.
      default: ""
      selector:
        text:
    critical:
      name: Critical notification
      default: true
      selector:
        boolean:
    speakers:
      name: Speakers for the announcement
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    tts:
      name: Text-to-speech engine
      default: ""
      selector:
        entity:
          filter:
            - domain: tts
    extra_actions:
      name: Extra actions
      default: []
      selector:
        action:

mode: queued
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input members
    not_to: [unavailable, unknown]

variables:
  notify_service: !input notify_service
  critical: !input critical
  speakers: !input speakers
  tts: !input tts
  kind: "{{ trigger.to_state.attributes.event_type }}"
  member: "{{ device_attr(device_id(trigger.entity_id), 'name') }}"
  tracker: >
    {{ device_entities(device_id(trigger.entity_id)) | select('match', 'device_tracker\\.') | first | default('') }}
  map_url: >
    {% set lat = state_attr(tracker, 'latitude') if tracker else none %}
    {% set lng = state_attr(tracker, 'longitude') if tracker else none %}
    {{ 'https://maps.google.com/?q=' ~ lat ~ ',' ~ lng if lat is number and lng is number else '' }}
  critical_data: >
    {{ {'push': {'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}},
        'ttl': 0, 'priority': 'high', 'channel': 'alarm_stream'} if critical else {} }}

conditions:
  - condition: template
    value_template: >
      {{ (now() - as_datetime(trigger.to_state.state)).total_seconds() < 120
         and kind == 'crash' }}

actions:
  - if:
      - condition: template
        value_template: "{{ notify_service | trim | length > 0 }}"
    then:
      - action: "{{ notify_service | trim }}"
        data:
          title: "Possible crash · {{ member }}"
          message: "Plumio detected a possible crash for {{ member }}. {{ map_url }}"
          data: "{{ dict(critical_data, url=map_url, clickAction=map_url) if map_url else critical_data }}"
  - if:
      - condition: template
        value_template: "{{ speakers | count > 0 and tts | length > 0 }}"
    then:
      - action: tts.speak
        target:
          entity_id: "{{ tts }}"
        data:
          media_player_entity_id: "{{ speakers }}"
          message: "Attention: Plumio detected a possible crash for {{ member }}."
  - sequence: !input extra_actions
