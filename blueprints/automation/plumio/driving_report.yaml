blueprint:
  name: "Plumio: driving alerts and trip summary"
  description: >
    Tell me when a member goes over the speed limit, and send a summary at the
    end of each trip (distance, top speed, hard braking). Needs Plumio Premium.
  domain: automation
  source_url: https://github.com/rey9230/plumio-homeassistant/blob/main/blueprints/automation/plumio/driving_report.yaml
  author: Plumio
  homeassistant:
    min_version: "2024.10.0"
  input:
    members:
      name: Members
      description: The members' "Events" entities.
      selector:
        entity:
          multiple: true
          filter:
            - integration: plumio
              domain: event
    speed_alerts:
      name: Speed alerts
      default: true
      selector:
        boolean:
    trip_summary:
      name: Trip summary
      default: true
      selector:
        boolean:
    only_with_incidents:
      name: Only summaries of trips with incidents
      description: Skip the trips without speeding, hard braking or rapid acceleration.
      default: false
      selector:
        boolean:
    notify_service:
      name: Notification action
      description: >
        A notify action such as `notify.mobile_app_pixel_8`, or a group like
        `notify.family`.
      selector:
        text:

mode: queued
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input members
    not_to: [unavailable, unknown]

variables:
  notify_service: !input notify_service
  speed_alerts: !input speed_alerts
  trip_summary: !input trip_summary
  only_with_incidents: !input only_with_incidents
  a: "{{ trigger.to_state.attributes }}"
  kind: "{{ a.event_type }}"
  member: "{{ device_attr(device_id(trigger.entity_id), 'name') }}"
  incidents: >
    {{ (a.hard_braking_count or 0) + (a.rapid_accel_count or 0) + (a.speeding_count or 0) }}

conditions:
  - condition: template
    value_template: >
      {{ (now() - as_datetime(trigger.to_state.state)).total_seconds() < 120
         and ((speed_alerts and kind == 'speed_alert')
              or (trip_summary and kind == 'trip_completed'
                  and (not only_with_incidents or incidents | int > 0))) }}

actions:
  - action: "{{ notify_service | trim }}"
    data:
      title: "Plumio · {{ member }}"
      message: >
        {% if kind == 'speed_alert' %}
          {{ member }} is going over the speed limit{{ ' (' ~ (a.kmh | round(0) | int) ~ ' km/h)' if a.kmh is defined else '' }}.
        {% else %}
          {{ member }} finished a trip{{ ' to ' ~ a.dest_name if a.dest_name else '' }}:
          {{ ((a.distance_meters or 0) / 1000) | round(1) }} km,
          top speed {{ ((a.max_speed or 0) * 3.6) | round(0) | int }} km/h,
          {{ incidents }} incident(s).
        {% endif %}
