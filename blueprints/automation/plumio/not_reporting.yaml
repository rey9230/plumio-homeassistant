blueprint:
  name: "Plumio: a member stopped reporting"
  description: >
    A member's phone has not sent its location for 30 minutes (dead battery, no
    signal, app closed). Get told, and get told again when it is back.
  domain: automation
  source_url: https://github.com/rey9230/plumio-homeassistant/blob/main/blueprints/automation/plumio/not_reporting.yaml
  author: Plumio
  homeassistant:
    min_version: "2024.10.0"
  input:
    members:
      name: Members
      description: The members' "Events" entities.
      selector:
        entity:
          multiple: true
          filter:
            - integration: plumio
              domain: event
    notify_back:
      name: Also tell me when it is back
      default: true
      selector:
        boolean:
    notify_service:
      name: Notification action
      description: >
        A notify action such as `notify.mobile_app_pixel_8`, or a group like
        `notify.family`.
      selector:
        text:
    extra_actions:
      name: Extra actions when it stops reporting
      default: []
      selector:
        action:

mode: queued
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input members
    not_to: [unavailable, unknown]

variables:
  notify_service: !input notify_service
  notify_back: !input notify_back
  kind: "{{ trigger.to_state.attributes.event_type }}"
  member: "{{ device_attr(device_id(trigger.entity_id), 'name') }}"

conditions:
  - condition: template
    value_template: >
      {{ (now() - as_datetime(trigger.to_state.state)).total_seconds() < 120
         and (kind == 'member_stale' or (notify_back and kind == 'member_back')) }}

actions:
  - action: "{{ notify_service | trim }}"
    data:
      title: Plumio
      message: >
        {% if kind == 'member_stale' %}
          {{ member }}'s phone has not reported for 30 minutes.
        {% else %}
          {{ member }}'s phone is reporting again.
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ kind == 'member_stale' }}"
    then:
      - sequence: !input extra_actions
