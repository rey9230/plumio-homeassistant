blueprint:
  name: "Plumio: arrives at or leaves a place"
  description: >
    Tell me when someone arrives at or leaves one of the Nest's places (school,
    work, grandma's…), and optionally run actions.
  domain: automation
  source_url: https://github.com/rey9230/plumio-homeassistant/blob/main/blueprints/automation/plumio/place_alert.yaml
  author: Plumio
  homeassistant:
    min_version: "2024.10.0"
  input:
    members:
      name: Members
      description: The members' "Events" entities.
      selector:
        entity:
          multiple: true
          filter:
            - integration: plumio
              domain: event
    place:
      name: Place name
      description: Exactly as it is called in Plumio. Leave empty for every place.
      default: ""
      selector:
        text:
    direction:
      name: When
      default: both
      selector:
        select:
          options:
            - label: Arrives
              value: arrival
            - label: Leaves
              value: departure
            - label: Both
              value: both
    notify_service:
      name: Notification action
      description: >
        A notify action such as `notify.mobile_app_pixel_8`, or a group like
        `notify.family`. Leave empty to not send a notification.
      default: ""
      selector:
        text:
    arrival_message:
      name: Arrival message
      default: "{{ member }} arrived at {{ place }}"
      selector:
        text:
    departure_message:
      name: Departure message
      default: "{{ member }} left {{ place }}"
      selector:
        text:
    extra_actions:
      name: Extra actions
      default: []
      selector:
        action:

mode: queued
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input members
    not_to: [unavailable, unknown]

variables:
  wanted_place: !input place
  direction: !input direction
  notify_service: !input notify_service
  kind: "{{ trigger.to_state.attributes.event_type }}"
  place: "{{ trigger.to_state.attributes.place_name }}"
  member: "{{ device_attr(device_id(trigger.entity_id), 'name') }}"
  arrival_message: !input arrival_message
  departure_message: !input departure_message

conditions:
  - condition: template
    value_template: >
      {{ (now() - as_datetime(trigger.to_state.state)).total_seconds() < 120
         and kind in ['arrival', 'departure']
         and (direction == 'both' or direction == kind)
         and (wanted_place | trim == '' or (place | lower) == (wanted_place | trim | lower)) }}

actions:
  - if:
      - condition: template
        value_template: "{{ notify_service | trim | length > 0 }}"
    then:
      - action: "{{ notify_service | trim }}"
        data:
          title: Plumio
          message: "{{ arrival_message if kind == 'arrival' else departure_message }}"
  - sequence: !input extra_actions
