blueprint:
  name: "Plumio: SOS at home"
  description: >
    When a member presses SOS in Plumio, make the whole house know: a critical
    notification (it rings even on silent), lights in red, the siren and an
    announcement on the speakers. When the SOS is resolved, everything goes back
    and your "resolved" actions run.
  domain: automation
  source_url: https://github.com/rey9230/plumio-homeassistant/blob/main/blueprints/automation/plumio/sos_alarm.yaml
  author: Plumio
  homeassistant:
    min_version: "2024.10.0"
  input:
    members:
      name: Members
      description: The members' "SOS" sensors.
      selector:
        entity:
          multiple: true
          filter:
            - integration: plumio
              domain: binary_sensor
              device_class: safety
    notify_service:
      name: Notification action
      description: >
        A notify action such as `notify.mobile_app_pixel_8`, or a group like
        `notify.family`. Leave empty to not send a notification.
      default: ""
      selector:
        text:
    critical:
      name: Critical notification
      description: Rings even when the phone is on silent or Do Not Disturb.
      default: true
      selector:
        boolean:
    lights:
      name: Lights to turn red
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
    sirens:
      name: Sirens
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: siren
    speakers:
      name: Speakers for the announcement
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    tts:
      name: Text-to-speech engine
      description: Needed for the announcement.
      default: ""
      selector:
        entity:
          filter:
            - domain: tts
    sos_actions:
      name: Extra actions on SOS
      default: []
      selector:
        action:
    resolved_actions:
      name: Actions when the SOS is resolved
      default: []
      selector:
        action:

mode: queued
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input members
    from: "off"
    to: "on"
    id: sos
  - trigger: state
    entity_id: !input members
    from: "on"
    to: "off"
    id: resolved

variables:
  notify_service: !input notify_service
  critical: !input critical
  lights: !input lights
  sirens: !input sirens
  speakers: !input speakers
  tts: !input tts
  member: "{{ device_attr(device_id(trigger.entity_id), 'name') }}"
  tracker: >
    {{ device_entities(device_id(trigger.entity_id)) | select('match', 'device_tracker\\.') | first | default('') }}
  map_url: >
    {% set lat = state_attr(tracker, 'latitude') if tracker else none %}
    {% set lng = state_attr(tracker, 'longitude') if tracker else none %}
    {{ 'https://maps.google.com/?q=' ~ lat ~ ',' ~ lng if lat is number and lng is number else '' }}
  critical_data: >
    {{ {'push': {'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}},
        'ttl': 0, 'priority': 'high', 'channel': 'alarm_stream'} if critical else {} }}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'sos' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ notify_service | trim | length > 0 }}"
            then:
              - action: "{{ notify_service | trim }}"
                data:
                  title: "SOS · {{ member }}"
                  message: "{{ member }} pressed SOS in Plumio. {{ map_url }}"
                  data: "{{ dict(critical_data, url=map_url, clickAction=map_url) if map_url else critical_data }}"
          - if:
              - condition: template
                value_template: "{{ lights | count > 0 }}"
            then:
              - action: light.turn_on
                target:
                  entity_id: "{{ lights }}"
                data:
                  rgb_color: [255, 0, 0]
                  brightness_pct: 100
          - if:
              - condition: template
                value_template: "{{ sirens | count > 0 }}"
            then:
              - action: siren.turn_on
                target:
                  entity_id: "{{ sirens }}"
          - if:
              - condition: template
                value_template: "{{ speakers | count > 0 and tts | length > 0 }}"
            then:
              - action: tts.speak
                target:
                  entity_id: "{{ tts }}"
                data:
                  media_player_entity_id: "{{ speakers }}"
                  message: "Attention: {{ member }} pressed SOS."
          - sequence: !input sos_actions
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'resolved' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ sirens | count > 0 }}"
            then:
              - action: siren.turn_off
                target:
                  entity_id: "{{ sirens }}"
          - if:
              - condition: template
                value_template: "{{ notify_service | trim | length > 0 }}"
            then:
              - action: "{{ notify_service | trim }}"
                data:
                  title: Plumio
                  message: "{{ member }}'s SOS was resolved."
          - sequence: !input resolved_actions
